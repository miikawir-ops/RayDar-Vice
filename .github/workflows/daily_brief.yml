name: RayDar Vice — Daily Intelligence Brief
 
on:
  schedule:
    - cron: '0 5 * * *'   # 07:00 EET (UTC+2)
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install requests feedparser jinja2 google-genai==1.10.0
 
      - name: Test import
        run: |
          python -c "from google import genai; print('genai import OK')"
          python -c "import feedparser; print('feedparser OK')"
          python -c "import jinja2; print('jinja2 OK')"
 
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_agent.py
 
      - name: Commit & push report
        run: |
          git config user.name  "RayDar Vice Bot"
          git config user.email "red@nicks-pizza-espoo"
          git add raydar_vice.html seen_hashes.json signal_history.json
          git diff --staged --quiet || git commit -m "Daily brief — $(date +'%Y-%m-%d')"
          git push

      # Split-repo hosting (2026-10-25): this repo becomes private (RayDar-Vice-src)
      # and the public miikawir-ops/RayDar-Vice holds only the published pages.
      # Only the files listed here are published, paths preserved.
      - name: Prepare curated site
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html raydar_vice.html quantum.html _site/

      # Skips (exit 0) until the SITE_DEPLOY_KEY secret exists; after that a
      # failed push fails the run. Refuses code/data files; keeps CNAME/.nojekyll.
      - name: Publish to the public site repo
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: python tools/publish_site.py _site miikawir-ops/RayDar-Vice
