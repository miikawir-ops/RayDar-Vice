name: RayDar Vice — Daily Intelligence Brief
 
on:
  schedule:
    - cron: '0 5 * * *'   # 07:00 EET (UTC+2)
  workflow_dispatch:
 
permissions:
  contents: write   # the commit-back of the daily brief
  pages: write      # actions/deploy-pages
  id-token: write   # actions/deploy-pages (OIDC)

# One run at a time, so two runs can't interleave their commit-backs or deploys.
concurrency:
  group: pages
  cancel-in-progress: false
 
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install requests feedparser jinja2 google-genai==1.10.0
 
      - name: Test import
        run: |
          python -c "from google import genai; print('genai import OK')"
          python -c "import feedparser; print('feedparser OK')"
          python -c "import jinja2; print('jinja2 OK')"
 
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_agent.py
 
      - name: Commit & push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raydar_vice.html seen_hashes.json signal_history.json
          git diff --staged --quiet || git commit -m "Daily brief — $(date +'%Y-%m-%d')"
          git push

      # Curated Pages output (2026-10-25): only the pages are published, paths
      # preserved. Code, templates and the JSON state files stay in the repo
      # but are no longer served. Pages source must be "GitHub Actions".
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html raydar_vice.html quantum.html _site/
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
