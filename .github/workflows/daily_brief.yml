name: RayDar Vice — Daily Intelligence Brief
 
on:
  schedule:
    - cron: '0 5 * * *'   # 07:00 EET (UTC+2)
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install requests feedparser jinja2 google-generativeai
 
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_agent.py
 
      - name: Commit & push report
        run: |
          git config user.name  "RayDar Vice Bot"
          git config user.email "red@nicks-pizza-espoo"
          git add raydar_vice.html seen_hashes.json
          git diff --staged --quiet || git commit -m "Daily brief — $(date +'%Y-%m-%d')"
          git push